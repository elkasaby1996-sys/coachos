name: Supabase Staging Empty Bootstrap

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [plan, preflight, apply]
        default: plan
        required: true
      confirm_commit_sha:
        type: string
        required: true
      confirm_project_ref:
        type: string
        required: true
      confirm_app_origin:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: supabase-staging-commercial
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: supabase-staging
    env:
      STAGING_GOVERNANCE_MODE: founder_owned_synthetic_staging_v1
      CONFIRM_COMMIT_SHA: ${{ inputs.confirm_commit_sha }}
      CONFIRM_PROJECT_REF: ${{ inputs.confirm_project_ref }}
      CONFIRM_APP_ORIGIN: ${{ inputs.confirm_app_origin }}
      BOOTSTRAP_MODE: ${{ inputs.mode }}
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      STAGING_APPLICATION_ORIGIN: ${{ vars.STAGING_APPLICATION_ORIGIN }}
      PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
      PRODUCTION_APPLICATION_ORIGIN: ${{ vars.PRODUCTION_APPLICATION_ORIGIN }}
    steps:
      - name: Start bounded admission clock before setup
        shell: bash
        run: echo "STAGING_WORKFLOW_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Local contracts and tests before remote capabilities
        run: npm run staging:commercial:validate && node scripts/validate-billing-retirement.mjs && npm run test:unit
      - name: Local plan
        run: node scripts/staging-bootstrap.mjs plan
      - name: Pinned CLI
        if: inputs.mode != 'plan'
        uses: supabase/setup-cli@v1
        with:
          version: v2.109.1
      - name: Separately authorized empty-project operation
        if: inputs.mode != 'plan'
        env:
          STAGING_FOUNDER_ACTION: ${{ secrets.STAGING_FOUNDER_ACTION }}
          STAGING_TIMING_ADMISSION: ${{ secrets.STAGING_TIMING_ADMISSION }}
          STAGING_BOOTSTRAP_AUTHORIZATION: ${{ secrets.STAGING_BOOTSTRAP_AUTHORIZATION }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          ALLOW_REMOTE_SUPABASE: ${{ inputs.mode == 'apply' && 'I_UNDERSTAND_THIS_TOUCHES_REMOTE' || '' }}
          SUPABASE_TELEMETRY_DISABLED: "1"
        run: node scripts/staging-bootstrap.mjs "$BOOTSTRAP_MODE"

  feature-quality:
    name: Check Ahmed-billing source
    if: github.repository == 'elkasaby1996-sys/coachos' && github.ref == 'refs/heads/Ahmed-billing'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate immutable billing payload
        run: npm run staging:commercial:validate && node scripts/validate-billing-retirement.mjs
      - name: Lint, format, build and typecheck billing functions
        run: npm run lint && npm run format && npm run build && node scripts/billing-edge-typecheck.mjs
      - name: Unit and CI regression tests
        run: npm run test:unit && node --test .github/scripts/ci-change-scope.test.mjs
      - name: Produce local installation plan
        run: node scripts/staging-initial-install.mjs plan
      - name: Upload reviewed source plan
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: staging-initial-plan-${{ github.run_id }}
          path: output/staging-release/initial-install-report.json
          retention-days: 7
          if-no-files-found: error

  feature-database:
    name: Test all staging migrations locally
    if: github.repository == 'elkasaby1996-sys/coachos' && github.ref == 'refs/heads/Ahmed-billing'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: v2.109.1
      - name: Start disposable local database with all canonical migrations
        run: supabase db start --yes
      - run: supabase db lint --local --level error --fail-on error
      - run: supabase test db

  feature-install:
    name: Approved initial staging installation
    if: github.repository == 'elkasaby1996-sys/coachos' && github.ref == 'refs/heads/Ahmed-billing' && inputs.mode != 'plan'
    needs: [feature-quality, feature-database]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: supabase-staging
    env:
      BOOTSTRAP_MODE: ${{ inputs.mode }}
      STAGING_INSTALL_ENVIRONMENT: supabase-staging
      STAGING_SUPABASE_PROJECT_REF: exmrksgdikfprtfeltzu
      STAGING_APPLICATION_ORIGIN: https://repsync-staging-replacement.netlify.app
      CONFIRM_COMMIT_SHA: ${{ inputs.confirm_commit_sha }}
      CONFIRM_PROJECT_REF: ${{ inputs.confirm_project_ref }}
      CONFIRM_APP_ORIGIN: ${{ inputs.confirm_app_origin }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install pinned Supabase CLI
        if: inputs.mode == 'apply'
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: v2.109.1
      - name: Inspect or install the confirmed staging project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ inputs.mode == 'apply' && secrets.SUPABASE_DB_PASSWORD || '' }}
          SUPABASE_PROJECT_REF: exmrksgdikfprtfeltzu
          ALLOW_REMOTE_SUPABASE: ${{ inputs.mode == 'apply' && 'I_UNDERSTAND_THIS_TOUCHES_REMOTE' || '' }}
        run: node scripts/staging-initial-install.mjs "$BOOTSTRAP_MODE"
      - name: Upload sanitized installation result
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: staging-initial-install-${{ github.run_id }}
          path: output/staging-release/initial-install-report.json
          retention-days: 7
          if-no-files-found: ignore
