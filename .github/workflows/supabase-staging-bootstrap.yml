name: Supabase Staging Empty Bootstrap

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [plan, preflight, apply]
        default: plan
        required: true
      confirm_commit_sha:
        type: string
        required: true
      confirm_project_ref:
        type: string
        required: true
      confirm_app_origin:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: supabase-staging-commercial
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: supabase-staging
    env:
      STAGING_GOVERNANCE_MODE: founder_owned_synthetic_staging_v1
      CONFIRM_COMMIT_SHA: ${{ inputs.confirm_commit_sha }}
      CONFIRM_PROJECT_REF: ${{ inputs.confirm_project_ref }}
      CONFIRM_APP_ORIGIN: ${{ inputs.confirm_app_origin }}
      BOOTSTRAP_MODE: ${{ inputs.mode }}
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      STAGING_APPLICATION_ORIGIN: ${{ vars.STAGING_APPLICATION_ORIGIN }}
      PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
      PRODUCTION_APPLICATION_ORIGIN: ${{ vars.PRODUCTION_APPLICATION_ORIGIN }}
    steps:
      - name: Start bounded admission clock before setup
        shell: bash
        run: echo "STAGING_WORKFLOW_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Local contracts and tests before remote capabilities
        run: npm run staging:commercial:validate && node scripts/validate-billing-retirement.mjs && npm run test:unit
      - name: Local plan
        run: node scripts/staging-bootstrap.mjs plan
      - name: Pinned CLI
        if: inputs.mode != 'plan'
        uses: supabase/setup-cli@v1
        with:
          version: v2.109.1
      - name: Separately authorized empty-project operation
        if: inputs.mode != 'plan'
        env:
          STAGING_FOUNDER_ACTION: ${{ secrets.STAGING_FOUNDER_ACTION }}
          STAGING_TIMING_ADMISSION: ${{ secrets.STAGING_TIMING_ADMISSION }}
          STAGING_BOOTSTRAP_AUTHORIZATION: ${{ secrets.STAGING_BOOTSTRAP_AUTHORIZATION }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          ALLOW_REMOTE_SUPABASE: ${{ inputs.mode == 'apply' && 'I_UNDERSTAND_THIS_TOUCHES_REMOTE' || '' }}
          SUPABASE_TELEMETRY_DISABLED: "1"
        run: node scripts/staging-bootstrap.mjs "$BOOTSTRAP_MODE"
