name: Paddle Staging Readiness

on:
  workflow_dispatch:
  push:
    branches: [Ahmed-billing]
    paths:
      - .github/workflows/paddle-staging-readiness.yml
      - scripts/staging-sandbox-readiness.mjs
      - tests/unit/staging-sandbox-readiness.test.ts

permissions:
  contents: read

concurrency:
  group: supabase-staging-commercial
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'elkasaby1996-sys/coachos' && github.ref == 'refs/heads/Ahmed-billing'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate immutable payload and catalogue inspection
        run: npm run staging:commercial:validate && node scripts/validate-billing-retirement.mjs && npx vitest run tests/unit/staging-sandbox-readiness.test.ts tests/unit/paddle-catalogue-verifier.test.ts tests/unit/staging-billing-status.test.ts
      - run: npm run lint && npm run format

  catalogue:
    name: Inspect sandbox catalogue and staging email settings
    if: github.repository == 'elkasaby1996-sys/coachos' && github.ref == 'refs/heads/Ahmed-billing'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: supabase-staging
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read catalogue without enabling checkout or creating payments
        env:
          STAGING_SUPABASE_PROJECT_REF: dgogugyuyfourdttvwuy
          PADDLE_ENVIRONMENT: sandbox
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PADDLE_SANDBOX_API_KEY: ${{ secrets.PADDLE_SANDBOX_API_KEY }}
        run: |
          mkdir -p output/staging-sandbox-readiness
          node --experimental-transform-types scripts/staging-sandbox-readiness.mjs > output/staging-sandbox-readiness/report.json
      - name: Retain sanitized inspection result
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: staging-sandbox-readiness-${{ github.run_id }}
          path: output/staging-sandbox-readiness/report.json
          retention-days: 7
          if-no-files-found: ignore
