name: Supabase Production Billing Retirement

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [plan, preflight, apply]
        default: plan
        required: true
      confirm_commit_sha:
        type: string
        required: true
      confirm_project_ref:
        type: string
        required: true
      confirm_app_origin:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: supabase-deploy-production
  cancel-in-progress: false

jobs:
  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: supabase-production
    env:
      CONFIRM_COMMIT_SHA: ${{ inputs.confirm_commit_sha }}
      CONFIRM_PROJECT_REF: ${{ inputs.confirm_project_ref }}
      CONFIRM_APP_ORIGIN: ${{ inputs.confirm_app_origin }}
      PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
      PRODUCTION_APPLICATION_ORIGIN: ${{ vars.PRODUCTION_APPLICATION_ORIGIN }}
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      STAGING_APPLICATION_ORIGIN: ${{ vars.STAGING_APPLICATION_ORIGIN }}

    steps:
      - name: Checkout dispatched main commit, not arbitrary input
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Paddle-only local deployment and history contracts
        run: node scripts/validate-billing-retirement.mjs

      - name: Local quality, type and unit gates
        run: npm run lint && npm run format && npm run build && npm run test:unit && node scripts/billing-edge-typecheck.mjs

      - name: Produce local-only retirement plan
        if: inputs.mode == 'plan'
        run: node scripts/production-billing-retirement.mjs plan

      - name: Read-only authorized production retirement preflight
        if: inputs.mode == 'preflight'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PRODUCTION_RETIREMENT_AUTHORIZATION: ${{ secrets.PRODUCTION_RETIREMENT_AUTHORIZATION }}
        run: node scripts/production-billing-retirement.mjs preflight

      - name: Setup pinned CLI for separately authorized retirement apply
        if: inputs.mode == 'apply'
        uses: supabase/setup-cli@v1
        with:
          version: v2.109.1

      - name: Apply only reviewed retirement; never enable production billing
        if: inputs.mode == 'apply'
        env:
          ALLOW_REMOTE_SUPABASE: I_UNDERSTAND_THIS_TOUCHES_REMOTE
          SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PRODUCTION_RETIREMENT_AUTHORIZATION: ${{ secrets.PRODUCTION_RETIREMENT_AUTHORIZATION }}
        run: node scripts/production-billing-retirement.mjs apply

      - name: Upload only sanitized retirement status, never backup/envelope/inventory
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: production-billing-retirement-${{ github.run_id }}
          path: output/production-billing-retirement/result.json
          retention-days: 7
          if-no-files-found: ignore
