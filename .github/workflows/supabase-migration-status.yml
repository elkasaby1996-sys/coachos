name: Supabase Migration Status

on:
  workflow_dispatch:
  push:
    branches: [Ahmed-billing]
    paths:
      - .github/workflows/supabase-migration-status.yml
      - scripts/staging-billing-status.mjs
      - scripts/staging-upgrade-readiness.mjs
      - scripts/staging-schema-diagnostics.mjs
      - scripts/staging-schema-reference.mjs

permissions:
  contents: read

concurrency:
  group: supabase-staging-commercial
  cancel-in-progress: false

jobs:
  schema-reference:
    if: github.repository == 'elkasaby1996-sys/coachos' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Ahmed-billing')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.109.1
      - name: Reconstruct source schemas on disposable local Postgres
        run: node scripts/staging-schema-reference.mjs "$RUNNER_TEMP/staging-schema-reference.json"
      - name: Share verified source reference with inspection job
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: staging-source-schema-${{ github.run_id }}
          path: ${{ runner.temp }}/staging-schema-reference.json
          retention-days: 1
          if-no-files-found: error

  migration-status:
    needs: schema-reference
    if: github.repository == 'elkasaby1996-sys/coachos' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Ahmed-billing')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: supabase-staging
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Install local contract dependencies
        run: npm ci

      - name: Read source reference from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: staging-source-schema-${{ github.run_id }}
          path: ${{ runner.temp }}/staging-source-schema

      - name: Inspect staging using existing GitHub credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: dgogugyuyfourdttvwuy
          STAGING_SCHEMA_REFERENCE_PATH: ${{ runner.temp }}/staging-source-schema/staging-schema-reference.json
        run: |
          mkdir -p output/staging-status
          node scripts/staging-upgrade-readiness.mjs > output/staging-status/report.json

      - name: Upload sanitized inventory
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: staging-billing-status-${{ github.run_id }}
          path: output/staging-status/report.json
          retention-days: 7
          if-no-files-found: ignore
